<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RT Scan</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #fafafa; }
  #reader { width: 100%; max-width: 480px; margin: 0 auto; }
  input, button { font-size: 18px; padding: 10px; box-sizing: border-box; }
  #manual { width: 70%; } #go { width: 28%; }
  #card { margin-top: 10px; padding: 12px; border-radius: 6px; display: none; }
  .MATCH { background: #d9f2d9; } .FALLBACK { background: #fff0c2; }
  .NOT_FOUND, .AMBIGUOUS, .ERR, .BAD_TOKEN, .LOCKED { background: #f8d0d0; }
  #to { font-size: 30px; font-weight: bold; margin: 6px 0; word-break: break-all; }
  .small { font-size: 13px; color: #444; } .name { font-size: 14px; }
  #setup { display: none; } #setup input { width: 100%; margin: 6px 0; }
  #msg { color: #a00; font-size: 14px; }
</style>
</head>
<body>
  <div id="setup">
    <h3>First-time setup</h3>
    <input id="apiUrl" placeholder="Apps Script web app URL (ends in /exec)">
    <input id="apiToken" type="password" placeholder="API token">
    <button id="save">Save</button>
  </div>

  <div id="main">
    <div id="reader"></div>
    <p><input id="manual" placeholder="or type / paste code" autocomplete="off"><button id="go">Go</button></p>
    <p><input type="file" id="file" accept="image/*" capture="environment"> <span class="small">photo fallback</span></p>
    <div id="msg"></div>
    <div id="card"></div>
    <p><button id="reset">Change settings</button></p>
  </div>

<script src="html5-qrcode.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; };
  const store = {
    get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
    del: k => { try { localStorage.removeItem(k); } catch (e) {} }
  };

  let scanner = null, lastText = '', lastTime = 0, busy = false;

  function boot() {
    if (!store.get('apiUrl') || !store.get('apiToken')) { $('setup').style.display = 'block'; $('main').style.display = 'none'; return; }
    $('setup').style.display = 'none'; $('main').style.display = 'block';
    startCamera();
  }
  $('save').onclick = () => {
    const u = $('apiUrl').value.trim(), t = $('apiToken').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)) { alert('URL must look like https://script.google.com/macros/s/.../exec'); return; }
    if (!t) { alert('Token required'); return; }
    store.set('apiUrl', u); store.set('apiToken', t); $('apiToken').value = ''; boot();
  };
  $('reset').onclick = () => { if (scanner) scanner.stop().catch(() => {}); store.del('apiUrl'); store.del('apiToken'); boot(); };

  function startCamera() {
    if (scanner) return;
    scanner = new Html5Qrcode('reader', { experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    scanner.start({ facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.5) }) },
      onDecode, () => {})
      .catch(err => { scanner = null; $('msg').textContent = 'Camera unavailable (' + err + '). Use the type box or photo fallback.'; });
  }

  function onDecode(text) {
    const now = Date.now();
    if (text === lastText && now - lastTime < 3000) return;   // ignore same code for 3 s
    lastText = text; lastTime = now;
    if (navigator.vibrate) navigator.vibrate(100);
    query(text);
  }

  async function query(code) {
    if (busy) return; busy = true; $('msg').textContent = '';
    try {
      const url = store.get('apiUrl') + '?' + new URLSearchParams({ code: code, token: store.get('apiToken') });
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
      const res = await fetch(url, { signal: ctl.signal }); clearTimeout(to);
      show(await res.json());
    } catch (e) { show({ status: 'ERR', note: 'Network/API error: ' + e.message }); }
    busy = false;
  }

  function show(r) {
    const card = $('card'); card.className = r.status; card.style.display = 'block'; card.textContent = '';
    if (r.status === 'MATCH' || r.status === 'FALLBACK') {
      card.append(el('div', 'small', r.status === 'MATCH' ? 'PUT AWAY TO' : 'NO SHELF - GROUP'));
      const to = el('div', '', r.to); to.id = 'to'; card.append(to);
      if (r.status === 'MATCH') card.append(el('div', 'small', 'Already holds ' + r.toQty + ' pcs'));
      card.append(el('div', 'name', r.name || ''));
      card.append(el('div', 'small', 'SKU ' + r.sku));
      card.append(el('div', 'small', 'From: ' + (r.from || []).map(f => f.loc + ' x' + f.qty).join(', ') + ' (total ' + r.total + ')'));
      card.append(el('div', 'small', 'Rule: ' + (r.rule || '')));
      if (r.alt && r.alt.length) card.append(el('div', 'small', 'Alt: ' + r.alt.join(', ')));
      if (r.note) card.append(el('div', 'small', r.note));
    } else {
      card.append(el('div', 'name', (r.status || 'ERR') + ': ' + (r.note || '')));
      if (r.scan) card.append(el('div', 'small', 'Scan: ' + r.scan));
      if (r.options) card.append(el('div', 'small', r.options.join(', ')));
    }
  }

  $('go').onclick = () => { const v = $('manual').value.trim(); if (v) { $('manual').value = ''; query(v); } };
  $('manual').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
  $('file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const tmp = scanner || new Html5Qrcode('reader');
      const text = await tmp.scanFile(f, false); query(text);
    } catch (err) { $('msg').textContent = 'No code found in photo'; }
    e.target.value = '';
  };
  boot();
</script>
</body>
</html>
